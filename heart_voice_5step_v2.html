        * {

            margin: 0;
            padding: 0;

        body {

            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 860px;
            padding: 2rem 1.5rem;
            z-index: 10;
            position: relative;
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            transition: var(--transition-smooth);
            min-height: 580px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1rem;
        }

        .brand-title {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            letter-spacing: 0.15em;
            color: var(--accent-warm);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-indicator {
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .step-progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .step-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-warm), var(--accent-rose));
            transition: width 0.6s ease;
        }

        .step-view {
            display: none;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            flex-direction: column;
            flex-grow: 1;
        }

        .step-view.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .step-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .step-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.25rem 1rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 0.75rem;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(226, 176, 120, 0.4);
            transform: translateY(-3px);
        }

        .option-card.selected {
            background: rgba(226, 176, 120, 0.12);
            border-color: var(--accent-warm);
            box-shadow: 0 0 20px rgba(226, 176, 120, 0.15);
        }

        .option-icon {
            font-size: 2rem;
        }

        .option-label {
            font-size: 1rem;
            letter-spacing: 0.05em;
        }

        .option-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        textarea, input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 1.25rem;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: var(--transition-smooth);
        }

        textarea:focus, input[type="text"]:focus {
            border-color: var(--accent-warm);
            box-shadow: 0 0 15px rgba(226, 176, 120, 0.2);
        }

        .app-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn {
            padding: 0.85rem 2rem;
            border-radius: 30px;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: none;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-sans);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-warm), #c8955a);
            color: #0d0f14;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(226, 176, 120, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(226, 176, 120, 0.4);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .player-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-warm);
            color: #0a0c10;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 1.2rem;
            transition: var(--transition-smooth);
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        .wave-visualizer {
            flex-grow: 1;
            height: 40px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .wave-bar {
            flex: 1;
            background: rgba(226, 176, 120, 0.3);
            border-radius: 2px;
            height: 20%;
            transition: height 0.2s ease;
        }

        .wave-bar.active {
            background: var(--accent-warm);
        }

        #cover-canvas {
            display: none;
        }

        .song-card-preview {
            width: 100%;
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(30, 36, 50, 0.8), rgba(15, 18, 25, 0.9));
            border: 1px solid var(--border-glow);
            padding: 2rem;
            margin: 1rem 0;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .lyric-box {
            font-family: var(--font-serif);
            line-height: 2;
            color: #e8eaed;
            white-space: pre-line;
            font-size: 1.05rem;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .lyric-box::-webkit-scrollbar {
            width: 4px;
        }
        .lyric-box::-webkit-scrollbar-thumb {
            background: rgba(226, 176, 120, 0.3);
            border-radius: 2px;
        }

        @media (max-width: 600px) {
            .glass-card {
                padding: 1.5rem 1.25rem;
            }
            .step-title {
                font-size: 1.4rem;
            }
            .option-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
<style>
.song-result{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:1.4rem;margin-top:1rem}.song-block{padding:1rem 0;border-bottom:1px solid rgba(255,255,255,.07)}.song-block:last-child{border-bottom:0}.song-label{font-size:.78rem;letter-spacing:.12em;color:var(--accent-warm);margin-bottom:.55rem}.song-lines{font-family:var(--font-serif);line-height:2;color:#f3f0ec}.hook-line{font-weight:700;color:#fff}.result-note{font-size:.86rem;line-height:1.8;color:var(--text-muted);background:rgba(0,0,0,.12);border-radius:14px;padding:1rem;margin-bottom:1rem}.cta-row{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.3rem}.mini{font-size:.78rem;color:var(--text-muted);margin-top:.8rem}

 if(step===3){let a=truths[sel.state];main.innerHTML=`<section class="step-view active"><h2 class="step-title">STEP 3｜如果可以說一句真心話……</h2><p class="step-subtitle">哪一句最接近你現在真正想說的？</p><div class="option-grid">${a.map((x,i)=>card(String(i),'♡',x)).join('')}</div></section>`;bind('truth')}
 if(step===4){let a=scenes[sel.state];main.innerHTML=`<section class="step-view active"><h2 class="step-title">STEP 4｜如果這份心聲變成一個畫面……</h2><p class="step-subtitle">選一個最像你腦中畫面的瞬間。</p><div class="option-grid">${a.map(x=>card(x[0],x[1],x[2])).join('')}</div></section>`;bind('scene')}
 if(step===5){main.innerHTML=`<section class="step-view active"><h2 class="step-title">STEP 5｜你希望這首歌最後怎麼唱？</h2><p class="step-subtitle">這會決定副歌之後，歌曲最後停在哪裡。</p><div class="option-grid">${endings.map(x=>card(x[0],x[1],x[2])).join('')}</div></section>`;bind('end');next.textContent='看看我的未完成歌曲 →'}
 if(step===6) result();restore();}
function bind(k){document.querySelectorAll('.option-card').forEach(el=>el.onclick=()=>{sel[k]=el.dataset.key;document.querySelectorAll('.option-card').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')})}
function restore(){if(step>=1&&step<=5){let k=['','weather','state','truth','scene','end'][step];document.querySelectorAll('.option-card').forEach(el=>{if(el.dataset.key===String(sel[k]))el.classList.add('selected')})}}
function required(){let k=['','weather','state','truth','scene','end'][step];return step===0||sel[k]!=null}
function title(){let h=hooks[sel.state][+sel.truth];let s=scenes[sel.state].find(x=>x[0]===sel.scene)[2];const names={tired:'先讓今天停一下',lost:'還沒決定哪一站',miss:'我還記得',change:'不是昨天的我',happy:'今天剛剛好',expect:'故事還沒開始'};return names[sel.state]+'｜'+s.replace(/的|還|一直|正在|沒有/g,'').slice(0,7)}
function result(){let h=hooks[sel.state][+sel.truth],truth=truths[sel.state][+sel.truth],tone=weatherTone[sel.weather],b=bridgeByEnd[sel.end];let endLine={quiet:'今晚先不用回答',release:'有些東西可以慢慢放下',forward:'下一步不用很遠，也算出發',hold:'至少這一次，先站在自己這邊',remember:'就把這一刻留在歌裡'}[sel.end];main.innerHTML=`<section class="step-view active"><h2 class="step-title">🎵 你的「未完成歌曲」出現了</h2><div class="result-note">這不是一首已經寫完的歌。我們只是把你剛才的選擇，整理成一個<strong>歌詞概念草稿</strong>。<br><br>有些句子還可以改，有些故事還沒說完。<br><strong>剩下的地方，再讓我們一起完成。</strong></div><div class="song-result"><div class="song-label">暫定歌名</div><h2 class="step-title" style="margin:.2rem 0 1rem">《${title()}》</h2><div class="song-block"><div class="song-label">VERSE｜主歌概念</div><div class="song-lines">${sceneLines[sel.scene]}<br>${tone}<br>有些話沒有說出口，先留在這個畫面裡……</div></div><div class="song-block"><div class="song-label">CHORUS｜副歌概念</div><div class="song-lines"><span class="hook-line">${h}</span><br>${truth}<br><span class="hook-line">${h}</span><br>${endLine}……</div></div><div class="song-block"><div class="song-label">BRIDGE｜橋段概念</div><div class="song-lines">${b[0]}<br>${b[1]}<br>也許真正想說的，還不只這些……</div></div></div><div class="cta-row"><a class="btn btn-primary" href="https://lin.ee/y2WelP7">一起完成這首歌 →</a><button class="btn btn-secondary" id="again">再玩一次</button></div></section>`;document.getElementById('again').onclick=()=>{step=1;sel={weather:null,state:null,truth:null,scene:null,end:null};render()}}
next.onclick=()=>{if(!required()){alert('先選一個最有感覺的答案 ♡');return}if(step<6){step++;render()}};prev.onclick=()=>{if(step>0){step--;render()}};render();
const canvas=document.getElementById('bg-canvas'),ctx=canvas.getContext('2d');let p=[];function rs(){canvas.width=innerWidth;canvas.height=innerHeight;p=Array.from({length:42},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+1,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,a:Math.random()*.3+.08}))}function dr(){ctx.clearRect(0,0,canvas.width,canvas.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;if(q.x<0||q.x>innerWidth)q.vx*=-1;if(q.y<0||q.y>innerHeight)q.vy*=-1;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fillStyle=`rgba(226,176,120,${q.a})`;ctx.fill()});requestAnimationFrame(dr)}addEventListener('resize',rs);rs();dr();
</script></body></html>
